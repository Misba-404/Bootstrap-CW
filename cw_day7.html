<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
    <title>Travel page</title>
  </head>
  <body>
    <div class="container-fluid">
      <div id="travel" class="carousel slide" data-ride="carousel">
        <ul class="carousel-indicators">
          <li data-target="#travel" data-slide-to="0" class="active"></li>
          <li data-target="#travel" data-slide-to="1"></li>
          <li data-target="#travel" data-slide-to="2"></li>
        </ul>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img
              src="https://www.ekeralatourism.net/wp-content/uploads/2018/03/Alleppey.jpg"
              alt="alappuzha"
              class="d-block w-100"
            />
            <div class="carousel-caption">
              <h2>Alappuzha</h2>
            </div>
          </div>
          <div class="carousel-item">
            <img
              src="https://www.ekeralatourism.net/wp-content/uploads/2015/12/munnar-1.png"
              alt="munnar"
              class="d-block w-100"
            />
            <div class="carousel-caption">
              <h2>Munnar</h2>
            </div>
          </div>
          <div class="carousel-item">
            <img
              src="https://www.ekeralatourism.net/wp-content/uploads/2017/12/Kovalam.jpg"
              alt="kovalam"
              class="d-block w-100"
            />
            <div class="carousel-caption">
              <h2>Kovalam</h2>
            </div>
          </div>
          <a class="carousel-control-prev" href="#travel" data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </a>
          <a class="carousel-control-next" href="#travel" data-slide="next">
            <span class="carousel-control-next-icon"></span>
          </a>
        </div>
      </div>
      <!-- carousal complete -->
       
    </div>
  </body>
</html>
